<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste WebSocket - PAPINHO</title>
    <style>
        body { font-family: sans-serif; background: #0B0D10; color: #E7E9EC; padding: 20px; }
        #chat { height: 400px; overflow-y: auto; border: 1px solid #262B33; background: #14171C; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
        input { width: 70%; padding: 10px; background: #1C2028; border: 1px solid #262B33; color: white; border-radius: 4px;}
        button { padding: 10px 20px; background: #2DD4BF; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;}
    </style>
</head>
<body>
    <h2>Terminal de Teste (WebSocket)</h2>
    <div id="chat"></div>
    <input type="text" id="msg" placeholder="Digite uma mensagem para a mesa...">
    <button onclick="enviar()">Enviar</button>

    <script>
        const ws = new WebSocket("ws://localhost:8000/ws");
        const chat = document.getElementById("chat");

        function adicionarLinha(texto, cor = "#E7E9EC") {
            const p = document.createElement("p");
            p.style.color = cor;
            p.innerHTML = texto;
            chat.appendChild(p);
            chat.scrollTop = chat.scrollHeight;
        }

        ws.onopen = () => adicionarLinha("🟢 Conectado ao Servidor do Papinho!", "#4ADE80");
        ws.onclose = () => adicionarLinha("🔴 Desconectado do servidor.", "#F87171");

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            if (data.type === "session_created") {
                adicionarLinha(`<em>Sessão criada: ${data.payload.title}</em>`, "#9AA1AC");
            } 
            else if (data.type === "agent_thinking") {
                // Cria a linha na hora que o agente começa a pensar
                const id = data.payload.agentId;
                adicionarLinha(`<strong>[${id}]:</strong> <span id="msg-${id}"><em>Pensando...</em></span>`, "#A78BFA");
            }
            else if (data.type === "agent_stream") {
                // Injeta as letras uma a uma conforme chegam do WebSocket
                const span = document.getElementById(`msg-${data.payload.agentId}`);
                if(span) {
                    if(span.innerHTML === "<em>Pensando...</em>") span.innerHTML = "";
                    
                    // ESCUDO ANTI-TAG FANTASMA: Converte < e > em texto visível
                    const textoSeguro = data.payload.delta
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/\n/g, "<br>"); // Mantém as quebras de linha
                        
                    span.innerHTML += textoSeguro;
                }
            }
            else if (data.type === "error") {
                // Se o Python der erro, agora a gente vai ver o porquê!
                adicionarLinha(`🔴 Erro no ${data.payload.agentId || 'Sistema'}: ${data.payload.message}`, "#F87171");
            }
        };

        function enviar() {
            const input = document.getElementById("msg");
            if(!input.value) return;

            ws.send(JSON.stringify({ type: "send_message", content: input.value }));
            
            adicionarLinha(`<strong>Você:</strong> ${input.value}`);
            input.value = "";
        }
    </script>
</body>
</html>
